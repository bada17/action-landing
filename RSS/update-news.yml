name: 홈페이지 소식 자동 갱신

on:
  schedule:
    # 매일 09:00 KST(00:00 UTC)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: {} # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: RSS 가져와서 data/news.json 갱신
        run: node scripts/fetch-news.mjs

      - name: 변경사항 커밋 (변경 없으면 건너뜀)
        run: |
          git config user.name "action-bot"
          git config user.email "action-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" && exit 0
          git commit -m "chore: 최신 소식 자동 갱신"
          git push
